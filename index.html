<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chameleon & Butterflies AR</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
    </style>

    <script>
        // Универсальный компонент покадровой анимации спрайт-шита
        AFRAME.registerComponent('sprite-animator', {
            schema: {
                columns: {type: 'int', default: 4}, 
                rows: {type: 'int', default: 3},    
                fps: {type: 'int', default: 24}     
            },
            init: function () {
                this.colWidth = 1 / this.data.columns;
                this.rowHeight = 1 / this.data.rows;
                this.totalFrames = this.data.columns * this.data.rows;
                this.currentFrame = 0;
                this.timeAccumulator = 0;
                this.frameDuration = 1 / this.data.fps;
                this.isPlaying = false;

                const el = this.el;
                
                el.addEventListener('material-texture-loaded', (evt) => {
                    this.texture = evt.detail.texture;
                    this.texture.repeat.set(this.colWidth, this.rowHeight);
                });

                const targetEntity = document.querySelector('#ar-target');
                targetEntity.addEventListener('targetFound', () => { this.isPlaying = true; });
                targetEntity.addEventListener('targetLost', () => { this.isPlaying = false; });
            },
            tick: function (time, deltaTime) {
                if (!this.isPlaying || !this.texture) {
                    if (!this.texture) {
                        const mesh = this.el.getObject3D('mesh');
                        if (mesh && mesh.material && mesh.material.map) {
                            this.texture = mesh.material.map;
                            this.texture.repeat.set(this.colWidth, this.rowHeight);
                        }
                    }
                    return;
                }

                this.timeAccumulator += deltaTime / 1000;
                if (this.timeAccumulator >= this.frameDuration) {
                    this.timeAccumulator = 0;
                    this.currentFrame = (this.currentFrame + 1) % this.totalFrames;

                    const col = this.currentFrame % this.data.columns;
                    const row = Math.floor(this.currentFrame / this.data.columns);

                    this.texture.offset.x = col * this.colWidth;
                    this.texture.offset.y = (this.data.rows - 1 - row) * this.rowHeight;
                }
            }
        });
    </script>
</head>
<body>

    <!-- AR Сцена с привязкой к файлу targets.mind -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta:0.001;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Привязка к физическому маркеру с хамелеоном -->
        <a-entity mindar-image-target="targetIndex: 0" id="ar-target">
            
            <!-- 1. Самая левая -->
            

            <!-- 2. Левее центра -->
           

            <!-- 3. По центру левее (повыше) -->
        

            <!-- 4. Спираль -->
           

            <!-- 5. Правее центра -->
            <a-plane src="./spritesheet.png" 
                     position="0.9 0.9 0.05" rotation="0 0 0" width="0.16" height="0.16" 
                     material="shader: flat; transparent: true; side: double;"
                     sprite-animator="columns: 6; rows: 6; fps: 24">
            </a-plane>

            <!-- 6. Самая правая -->
           

        </a-entity>
        
    </a-scene>

</body>
</html>
